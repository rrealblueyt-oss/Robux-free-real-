<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap');
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050508;
            color: #ffffff;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Orbitron', sans-serif;
        }

        .bg-standard {
            background: radial-gradient(circle at center, #1a102f 0%, #050508 100%);
        }

        .bg-vip {
            background: radial-gradient(circle at center, #2b1055 0%, #75151e 50%, #050508 100%);
            animation: pulseBg 8s infinite alternate;
        }

        @keyframes pulseBg {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(36deg); }
        }

        .glass-card {
            background: rgba(15, 12, 29, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255, 215, 0, 0.05);
        }

        .glass-card-vip {
            background: rgba(20, 10, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .gold-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .gold-border-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .robux-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, rgba(30, 20, 50, 0.8) 0%, rgba(15, 10, 25, 0.9) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .robux-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: #ffd700;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .vip-button {
            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto;
            color: #000;
            font-weight: 800;
            transition: 0.5s;
        }

        .vip-button:hover {
            background-position: right center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.5);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .checkmark-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body class="bg-standard min-h-screen flex items-center justify-center p-4 relative transition-all duration-1000" id="mainBody">

    <div class="particles" id="particlesContainer"></div>

    <div class="w-full max-w-md z-10" id="loginSection">
        <div class="glass-card rounded-2xl p-8 text-center border relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/10 rounded-full blur-xl"></div>

            <h1 class="title-font text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-yellow-600 mb-2 tracking-widest gold-glow">???</h1>
            <p class="text-xs uppercase tracking-widest text-gray-400 mb-8">VIP Hub System</p>

            <div class="space-y-6">
                <div class="relative">
                    <input type="text" id="usernameInput" placeholder="usernameroblox" class="w-full bg-black/50 border border-gray-700 focus:border-amber-400 rounded-xl px-5 py-4 text-center text-white placeholder-gray-600 focus:outline-none transition-all duration-300 text-lg tracking-wide font-medium">
                </div>

                <button id="enterBtn" class="hidden w-full vip-button py-4 rounded-xl uppercase tracking-wider text-lg title-font transition-all duration-500 transform hover:scale-[1.02] active:scale-95 shadow-lg">
                    VÀO
                </button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-2xl z-10 hidden" id="vipSection">
        <div class="glass-card-vip rounded-3xl p-6 sm:p-10 text-center relative overflow-hidden">
            
            <div class="flex items-center justify-between border-b border-amber-500/20 pb-4 mb-8">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-amber-500/20 border border-amber-400 flex items-center justify-center">
                        <i class="fa-solid font-bold text-amber-400 text-lg">👑</i>
                    </div>
                    <div class="text-left">
                        <p class="text-xs text-amber-300 uppercase tracking-wider">VIP Member</p>
                        <p class="font-bold text-white tracking-wide" id="displayUsername"></p>
                    </div>
                </div>
                <span class="bg-amber-400/10 text-amber-300 border border-amber-400/30 text-xs px-3 py-1 rounded-full uppercase tracking-widest font-bold">VIP ACTIVE</span>
            </div>

            <h2 class="title-font text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-500 mb-2">CHỌN GÓI ROBUX VIP</h2>
            <p class="text-gray-400 text-sm mb-8">Chọn số lượng Robux muốn nhận vào tài khoản</p>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                
                <div class="robux-card rounded-2xl p-5 cursor-pointer flex flex-col items-center justify-center" onclick="selectRobux(100)">
                    <i class="fa-solid text-2xl text-amber-400 mb-2">💎</i>
                    <span class="title-font text-2xl font-black text-white">100</span>
                    <span class="text-xs text-gray-400 mt-1">ROBUX</span>
                </div>

                <div class="robux-card rounded-2xl p-5 cursor-pointer flex flex-col items-center justify-center" onclick="selectRobux(250)">
                    <i class="fa-solid text-2xl text-amber-400 mb-2">💎</i>
                    <span class="title-font text-2xl font-black text-white">250</span>
                    <span class="text-xs text-gray-400 mt-1">ROBUX</span>
                </div>

                <div class="robux-card rounded-2xl p-5 cursor-pointer flex flex-col items-center justify-center" onclick="selectRobux(500)">
                    <i class="fa-solid text-2xl text-amber-400 mb-2">💎</i>
                    <span class="title-font text-2xl font-black text-white">500</span>
                    <span class="text-xs text-gray-400 mt-1">ROBUX</span>
                </div>

                <div class="robux-card rounded-2xl p-5 cursor-pointer flex flex-col items-center justify-center relative overflow-hidden" onclick="selectRobux(777)">
                    <div class="absolute -right-6 -top-6 bg-red-600 text-white text-[9px] font-bold py-1 px-6 rotate-45">MAX</div>
                    <i class="fa-solid text-2xl text-amber-300 mb-2 gold-glow">👑</i>
                    <span class="title-font text-2xl font-black text-amber-300 gold-glow">777</span>
                    <span class="text-xs text-amber-300/80 mt-1 font-bold">ROBUX MAX</span>
                </div>

            </div>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-card-vip max-w-sm w-full rounded-3xl p-8 text-center transform scale-90 transition-transform duration-300" id="modalContent">
            <div class="flex justify-center mb-6">
                <div class="checkmark-circle">
                    <svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
            
            <h3 class="title-font text-xl font-bold text-white mb-2 uppercase tracking-wide">THÀNH CÔNG</h3>
            <p class="text-emerald-400 text-2xl font-extrabold mb-6 tracking-wide" id="modalMessage"></p>
            
            <button onclick="closeModal()" class="w-full vip-button py-3 rounded-xl uppercase tracking-wider text-sm title-font">
                XÁC NHẬN
            </button>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('usernameInput');
        const enterBtn = document.getElementById('enterBtn');
        const loginSection = document.getElementById('loginSection');
        const vipSection = document.getElementById('vipSection');
        const mainBody = document.getElementById('mainBody');
        const displayUsername = document.getElementById('displayUsername');
        const successModal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');
        const modalMessage = document.getElementById('modalMessage');
        const particlesContainer = document.getElementById('particlesContainer');

        usernameInput.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                enterBtn.classList.remove('hidden');
                enterBtn.classList.add('block');
            } else {
                enterBtn.classList.add('hidden');
                enterBtn.classList.remove('block');
            }
        });

        enterBtn.addEventListener('click', function() {
            const user = usernameInput.value.trim();
            if (user) {
                displayUsername.innerText = user;
                loginSection.classList.add('hidden');
                vipSection.classList.remove('hidden');
                mainBody.classList.remove('bg-standard');
                mainBody.classList.add('bg-vip');
                createParticles();
            }
        });

        function createParticles() {
            particlesContainer.innerHTML = '';
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 5 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 5 + 3}s`;
                particle.style.animationDelay = `${Math.random() * 2}s`;
                particlesContainer.appendChild(particle);
            }
        }

        function selectRobux(amount) {
            modalMessage.innerText = `đã nhận ${amount} robux`;
            successModal.classList.remove('hidden');
            setTimeout(() => {
                successModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            successModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
            setTimeout(() => {
                successModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
